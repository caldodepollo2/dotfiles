background {
    monitor = 
    path = ~/Pictures/fondo.png
    color = rgba(5, 10, 30, 0.95)
    
    blur_passes = 3
    blur_size = 12
    noise = 0.02
    contrast = 1.1
    brightness = 0.85
    vibrancy = 0.3
}

# Campo de contraseña
input-field {
    monitor = 
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    
    outer_color = rgba(0, 120, 215, 0.8)
    inner_color = rgba(0, 40, 80, 0.4)
    font_color = rgba(100, 200, 255, 1)
    
    fade_on_empty = false
    hide_input = false
    rounding = 8
    check_color = rgba(0, 255, 150, 0.7)
    fail_color = rgba(255, 50, 100, 0.8)
    capslock_color = rgba(255, 180, 0, 0.9)
    
    placeholder_text = <span foreground="##88DDFF"><i> ACCESS_CODE</i></span>
    fail_text = <span foreground="##FF5577"><i> ACCESS_DENIED</i></span>
    
    position = 0, 40
    halign = center
    valign = center
}

# Hora
label {
    monitor = 
    text = cmd[update:1000] echo "<span foreground='##00D4FF'>$(date +'%H')</span>:<span foreground='##88EEFF'>$(date +'%M')</span>"
    font_size = 68
    font_family = "JetBrainsMono Nerd Font Mono"
    
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 200, 255, 0.4)
    
    position = 0, 160
    halign = center
    valign = center
}

# Fecha
label {
    monitor = 
    text = cmd[update:60000] echo "<span foreground='##88BBFF'>[SECTOR_5]</span> <span foreground='##CCEEFF'>$(date +'%d.%m.%Y')</span>"
    font_size = 18
    font_family = "JetBrainsMono Nerd Font"
    
    position = 0, 100
    halign = center
    valign = center
}

# Usuario
label {
    monitor = 
    text = cmd[update:0] echo "<span foreground='##66CCFF'>VIRTUALIZER:</span> <span foreground='##AAEEFF'>$(whoami)</span>"
    font_size = 14
    font_family = "JetBrainsMono Nerd Font"
    
    position = 0, -30
    halign = center
    valign = center
}

# Caps lock
label {
    monitor = 
    text = cmd[update:10] bash -c 'if xset -q | grep -q "Caps Lock:[[:space:]]*on"; then echo "<span foreground=\"##FFAA00\">[CAPS_LOCK]</span>"; fi'
    font_size = 13
    font_family = "JetBrainsMono Nerd Font Mono"
    
    position = 0, -70
    halign = center
    valign = center
}