################
### MONITORS ###
################
monitor=eDP-1,1920x1080@60,0x0,1

################
### PROGRAMS ###
################
$terminal = kitty
$fileManager = thunar
$fileManager2 = kitty -e yazi
$menu = fuzzel
$browser = librewolf
$lock = hyprlock

#################
### AUTOSTART ###
#################
exec-once = /usr/lib/xdg-desktop-portal-hyprland
exec-once = rfkill unblock bluetooth
exec-once = bluetoothctl power off
exec-once = brightnessctl set 10%
exec-once = fnott
exec-once = waybar
exec-once = hyprpaper
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = sleep 2 && systemctl --user start hyprpolkitagent
exec-once = sleep 2 && hyprlock

#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Future-cyan-cursors
env = HYPRCURSOR_SIZE,32
env = HYPRCURSOR_THEME,Future-Cyan-Hyprcursor_Theme
env = GTK_THEME=LyokoBlue
env = QT_QPA_PLATFORMTHEME=gtk
env = QT_STYLE_OVERRIDE=gtk
env = WLR_RENDERER,vulkan
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = SDL_VIDEODRIVER=wayland
env = QT_QPA_PLATFORM=wayland
env = MOZ_ENABLE_WAYLAND=1

#####################
### LOOK AND FEEL ###
#####################
source = ~/.config/hypr/colors.conf

general {
    gaps_in = 8
    gaps_out = 16
    border_size = 3
    col.active_border = $lyoko-gradient
    col.inactive_border = $lyoko-bg-alt
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 0.96
    inactive_opacity = 0.85

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = $lyoko-lock-gradient
    }

    blur {
        enabled = true
        size = 4
        passes = 2
        vibrancy = 0.25
        special = true
        popups = true
    }
}

animations {
    enabled = true
    bezier = lyoko_quick, 0.25, 0, 0.2, 1
    bezier = lyoko_scan, 0.5, 1, 0.5, 0

    animation = windows, 1, 3, lyoko_quick, popin
    animation = border, 1, 2, lyoko_quick
    animation = fade, 1, 2, lyoko_quick
    animation = workspaces, 1, 3, lyoko_quick, slide
}

dwindle {
    preserve_split = false
    special_scale_factor = 0.95
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    animate_manual_resizes = false
    enable_swallow = true
}

#############
### INPUT ###
#############
input {
    kb_layout = es
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
        disable_while_typing = true
    }
}

###################
### KEYBINDINGS ###
###################
$mainMod = SUPER

# Lanzadores
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, E, exec, $fileManager2
bind = $mainMod, D, exec, $menu
bind = $mainMod, B, exec, $browser
bind = $mainMod, Q, killactive
bind = , Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshot_$(date +%Y%m%d_%H%M%S).png
bind = $mainMod, P, exec, ~/.local/bin/fuzzel-power.sh
bind = $mainMod, S, exec, ~/.local/bin/fuzzel-search.sh
bind = $mainMod, L, exec, $lock
bind = $mainMod, V, exec, cliphist list | fuzzel --dmenu --with-nth 2 | cliphist decode | wl-copy
bind = $mainMod, A, exec, hyprpicker -a -f hex

# Movimiento
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

binde = $mainMod CTRL, left, resizeactive, -10 0
binde = $mainMod CTRL, right, resizeactive, 10 0
binde = $mainMod CTRL, up, resizeactive, 0 -10
binde = $mainMod CTRL, down, resizeactive, 0 10

bind = $mainMod, Tab, cyclenext
bind = $mainMod SHIFT, Tab, cyclenext, prev

bind = $mainMod, F, togglefloating
bind = $mainMod, Space, fullscreen

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Controles del sistema
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%

bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+

bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPrev, exec, playerctl previous
