# Opciones globales 
[main]
output=eDP-1
min-width=300
max-width=400
max-height=600
icon-theme=Papirus-Dark
max-icon-size=32
stacking-order=bottom-up
anchor=top-right
edge-margin-vertical=20
edge-margin-horizontal=20
notification-margin=10
selection-helper=fuzzel --dmenu
selection-helper-uses-null-separator=no
play-sound=pw-play ${filename}
scaling-filter=lanczos3
layer=overlay

# Formatos y fuentes
title-font=JetBrains Mono Nerd Font:size=11:weight=bold
title-color=66ccffff
title-format=<i>%a%A</i>

summary-font=JetBrains Mono Nerd Font:size=10:weight=bold
summary-color=cfefffff
summary-format=<b>%s\n</b>

body-font=JetBrains Mono Nerd Font:size=10
body-color=aee7ffff
body-format=%b

# Diseño y colores
background=050a12f0
border-color=00cfffff
border-radius=12
border-size=2
padding-vertical=10
padding-horizontal=10
dpi-aware=no
progress-bar-height=6
progress-color=00cfffff
progress-style=bar

# Tiempos
max-timeout=10
default-timeout=6
idle-timeout=0

# Icono
icon=info

# Prioridad baja
[low]
background=0a1428e6
border-color=4da6ffff
title-color=88bbffff
summary-color=88aaffff
body-color=88ccffff
default-timeout=4
icon=info

# Prioridad normal
[normal]
background=050a12f0
border-color=00cfffff
title-color=66caffff
summary-color=cfefffff
body-color=aee7ffff
default-timeout=6
icon=info

# Prioridad alta 
[critical]
background=1a050af0
border-color=ff4d4dff
title-color=ff6666ff
summary-color=ffaaaaff
body-color=ffbbbfff
max-timeout=0
default-timeout=0
icon=error